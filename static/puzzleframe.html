<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <script src="puzzleframe.js"></script>
    <style>
body {
    margin: 0px;
    overflow: hidden;
}

#puzzlecanvas {
    display: block;
    font-family: sans-serif;
    width: 100%;
}

#dlgform {
    display: none;
}

#resizable {
    position: relative;
}

#resizehandle {
    position: absolute;
    bottom: 0px;
    right: 0px;
}

/* Overlay for the "highlight next digit group" toggle (see
   toggleNextGroupHighlight() in src/puzzles.js and
   setDigitGroupHighlight() below). Sized as a percentage of #resizable,
   which -- because #puzzlecanvas has width:100% and no explicit height,
   so its rendered box preserves its own bitmap aspect ratio -- always
   exactly matches the on-screen canvas, at any zoom/resize/DPI, without
   any pixel-based measurement. pointer-events:none so it never
   intercepts clicks meant for the puzzle underneath. */
#digitGroupHighlight {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.digit-group-highlight-cell {
    position: absolute;
    background-color: rgba(255, 200, 0, 0.45);
    box-sizing: border-box;
}

/* Overlay for the "grey out extra clues" toggle (see
   toggleExtraClueGreyOut() in src/puzzles.js and
   setExtraClueGreyOut() below). Its own sibling of #digitGroupHighlight,
   not a shared div, so the two toggles can be shown together without
   one's redraw clearing the other's boxes. Same sizing/positioning
   rationale as #digitGroupHighlight above. Placed earlier in the DOM
   (see the body markup below) so the amber "next group" highlight, if
   also on, paints on top of the grey overlay rather than under it --
   in practice the two never target the same cell (a cell needed for
   the next group is never also "extra"), but this keeps the intended
   focus indicator on top if that ever changes. */
#extraClueGreyOut {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.extra-clue-greyout-cell {
    position: absolute;
    background-color: rgba(60, 60, 60, 0.6);
    box-sizing: border-box;
}

/* Overlay for the "highlight ambiguous cage order" toggle (see
   toggleAmbiguousOrderHighlight() in src/puzzles.js and
   setAmbiguousOrderHighlight() below). A third sibling of
   #digitGroupHighlight/#extraClueGreyOut, not a shared div, so all
   three toggles can be shown together without one's redraw clearing
   another's boxes. Same sizing/positioning rationale as
   #digitGroupHighlight above. Placed between the grey-out overlay and
   the amber "next group" highlight in the DOM (see the body markup
   below), so the amber highlight -- a stronger, more specific signal
   ("this digit is fully forced") -- always paints on top if it and
   this overlay ever somehow targeted the same cell; in practice they
   never do, since a cell counted here always has more than one
   remaining candidate, while the amber highlight only ever covers
   cells with exactly one. */
#ambiguousOrderHighlight {
    position: absolute;
    top: 0px;
    left: 0px;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

.ambiguous-order-highlight-cell {
    position: absolute;
    background-color: rgba(40, 180, 40, 0.4);
    box-sizing: border-box;
}

    </style>
</head>

<body>
    <div id="resizable">
        <canvas id="puzzlecanvas" tabindex="0"></canvas>
        <div id="extraClueGreyOut"></div>
        <div id="ambiguousOrderHighlight"></div>
        <div id="digitGroupHighlight"></div>
        <svg id="resizehandle" aria-label="resize" width='10' height='10'>
            <title>Drag to resize the puzzle. Right-click to restore the default size.</title>
            <path d='M8.5,1.5l-7,7m7,-4l-4,4m4,-1l-1,1' stroke='currentColor' stroke-linecap='round'></path>
        </svg>
    </div>
    <div style="display: none;">
        <!-- Hidden form controls to appease the JS frontend  -->
        <!-- They aren't being used and I could just get rid of them, but that might break things -->
        <div id="puzzle"></div>
        <form id="gamemenu">
            <ul>
                <li>
                    <div tabindex="0">Game<ul>
                            <li><button type="button" id="specific">Enter game ID...</button></li>
                            <li><button type="button" id="random">Enter random seed...</button></li>
                            <li><button type="button" id="save">Download save file...</button></li>
                            <li><button type="button" id="load">Upload save file...</button></li>
                            <li><button type="button" id="prefs">Preferences...</button></li>
                        </ul>
                    </div>
                </li>
                <li>
                    <div tabindex="0">Type<ul role="menu" id="gametype"></ul>
                    </div>
                </li>
                <li role="separator"></li>
                <li><button type="button" id="new">
                        New<span class="verbiage"> game</span>
                    </button></li>
                <li><button type="button" id="restart">
                        Restart<span class="verbiage"> game</span>
                    </button></li>
                <li><button type="button" id="undo">
                        Undo<span class="verbiage"> move</span>
                    </button></li>
                <li><button type="button" id="redo">
                        Redo<span class="verbiage"> move</span>
                    </button></li>
                <li><button type="button" id="solve">
                        Solve<span class="verbiage"> game</span>
                    </button></li>
            </ul>
        </form>
        <div id="statusbar"></div>
        <p>
            Link to this puzzle:
            <a id="permalink-desc">by game ID</a>
            <a id="permalink-seed">by random seed</a>
        </p>
        </main>
        <div id="apology">
            <p class="apology-title">
            </p>
        </div>
        <hr>
    </div>
</body>

</html>
